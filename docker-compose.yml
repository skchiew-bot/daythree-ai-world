name: daythree-ai-world

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-dev}
  SECRET_KEY: ${SECRET_KEY:-change-me-to-a-random-64-char-string}
  JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
  JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-daythree}:${POSTGRES_PASSWORD:-daythree_dev_password}@postgres:5432/${POSTGRES_DB:-daythree}
  REDIS_URL: redis://redis:6379/0
  REDIS_STREAM_NAME: ${REDIS_STREAM_NAME:-daythree.events}
  OBJECT_STORE_ENDPOINT_URL: http://minio:9000
  OBJECT_STORE_ACCESS_KEY: ${OBJECT_STORE_ACCESS_KEY:-daythree_minio}
  OBJECT_STORE_SECRET_KEY: ${OBJECT_STORE_SECRET_KEY:-daythree_minio_secret}
  OBJECT_STORE_BUCKET: ${OBJECT_STORE_BUCKET:-daythree-artifacts}
  OBJECT_STORE_REGION: ${OBJECT_STORE_REGION:-us-east-1}
  OBJECT_STORE_SIGNED_URL_TTL_SECONDS: ${OBJECT_STORE_SIGNED_URL_TTL_SECONDS:-300}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEFAULT_MODEL_PROVIDER: ${DEFAULT_MODEL_PROVIDER:-mock}
  DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-claude-sonnet-5}
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
  OTEL_SERVICE_NAME: daythree-api
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PYTHONPATH: /repo/packages:/repo/packages/policy-sdk:/repo/packages/tool-sdk:/repo/services:/repo/services/mission-engine:/repo/services/agent-runtime:/repo/services/model-gateway:/repo/services/event-service:/repo/services/artifact-service

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-daythree}
      POSTGRES_USER: ${POSTGRES_USER:-daythree}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-daythree_dev_password}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-daythree}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-daythree_minio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-daythree_minio_secret}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${OBJECT_STORE_ACCESS_KEY:-daythree_minio} ${OBJECT_STORE_SECRET_KEY:-daythree_minio_secret} &&
      mc mb -p local/${OBJECT_STORE_BUCKET:-daythree-artifacts} &&
      mc anonymous set none local/${OBJECT_STORE_BUCKET:-daythree-artifacts}
      "
    restart: "no"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/compose/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports: ["4317:4317", "8889:8889"]

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infrastructure/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    volumes:
      - ./infrastructure/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    environment: *backend-env
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    volumes:
      - ./packages:/repo/packages
      - ./services:/repo/services

  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/worker.Dockerfile
    environment: *backend-env
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes:
      - ./packages:/repo/packages
      - ./services:/repo/services

  admin-web:
    build:
      context: .
      dockerfile: infrastructure/docker/admin-web.Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  pgdata:
  miniodata:
